<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="32" fill="#1b242a"/>
  <!-- Subtle architectural grid circle -->
  <circle cx="32" cy="32" r="28" stroke="#3d5a52" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="24" stroke="#52796f" stroke-width="1"/>
  <!-- Architectural Crosshairs -->
  <line x1="32" y1="4" x2="32" y2="12" stroke="#52796f" stroke-width="1"/>
  <line x1="32" y1="52" x2="32" y2="60" stroke="#52796f" stroke-width="1"/>
  <line x1="4" y1="32" x2="12" y2="32" stroke="#52796f" stroke-width="1"/>
  <line x1="52" y1="32" x2="60" y2="32" stroke="#52796f" stroke-width="1"/>
  <!-- AM Monogram -->
  <text x="32" y="38" text-anchor="middle" font-family="'Cinzel', 'Source Sans 3', Georgia, serif" font-size="20" font-weight="600" fill="#f4f7f6" letter-spacing="1">AM</text>
</svg>